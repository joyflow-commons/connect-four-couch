<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connect Four: Couch Edition</title>
<style>
  :root {
    --wall: #178a9d;
    --wall-deep: #0e6b7c;
    --couch: #9e2430;
    --couch-deep: #7a1a24;
    --teal: #1fb6a6;
    --teal-deep: #0f7c72;
    --gold: #d9a441;
    --gold-bright: #f0c060;
    --cream: #f3e9d2;
    --wood: #4a2c2a;
    --wood-deep: #3a2220;
    --ink: #23222b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at 30% 10%, var(--wall) 0%, var(--wall-deep) 80%);
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--cream);
    display: flex; flex-direction: column; align-items: center;
  }
  header {
    width: 100%; max-width: 560px;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px 4px;
  }
  #badge {
    width: 62px; height: 62px; border-radius: 50%;
    border: 3px solid var(--gold); object-fit: cover;
    background: var(--wall-deep); flex: none;
  }
  h1 {
    font-size: clamp(16px, 4.5vw, 24px); margin: 0; line-height: 1.1;
    color: var(--gold-bright); letter-spacing: 1px;
    text-shadow: 2px 2px 0 var(--couch-deep);
    font-weight: 900;
  }
  h1 small { display:block; font-size: 11px; color: var(--cream); letter-spacing: 2px; font-weight: normal; }
  #score {
    width: 100%; max-width: 560px; text-align: center;
    font-size: 12px; letter-spacing: 1px; color: rgba(243,233,210,.75);
    padding: 4px 0 0;
  }
  #score b.red { color: #ff8d96; }
  #score b.teal { color: #6fe3d6; }
  #banner {
    width: 100%; max-width: 560px; text-align: center;
    padding: 8px 14px; font-size: clamp(14px, 4vw, 18px);
    font-style: italic; min-height: 40px;
  }
  #banner.mine { color: var(--gold-bright); font-weight: bold; font-style: normal; }
  #taunt {
    width: 100%; max-width: 560px; text-align: center;
    font-size: clamp(12px, 3.4vw, 15px); font-style: italic;
    color: rgba(243,233,210,.85); padding: 0 14px 8px; min-height: 22px;
  }
  #board-wrap { width: 100%; max-width: 560px; padding: 0 10px; }
  #board {
    background: linear-gradient(180deg, var(--wood), var(--wood-deep));
    border: 3px solid var(--gold);
    border-radius: 16px;
    padding: 3.5%;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2.2%;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  .col { display: flex; flex-direction: column; gap: 9px; cursor: pointer; }
  .cell {
    width: 100%; aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #1b3f47, #10262b 75%);
    box-shadow: inset 0 3px 6px rgba(0,0,0,.6);
    position: relative;
  }
  .disc {
    position: absolute; inset: 7%;
    border-radius: 50%;
    box-shadow: inset 0 -4px 8px rgba(0,0,0,.35), inset 0 3px 5px rgba(255,255,255,.2);
  }
  .disc.red  { background: radial-gradient(circle at 35% 30%, #c94b58, var(--couch) 55%, var(--couch-deep)); }
  .disc.teal { background: radial-gradient(circle at 35% 30%, #58dcCB, var(--teal) 55%, var(--teal-deep)); }
  .disc.fresh { animation: fall .45s cubic-bezier(.5, 0, .8, 1); }
  @keyframes fall {
    from { transform: translateY(calc(-70vh)); }
    to   { transform: translateY(0); }
  }
  .disc.glow {
    animation: pulse 1.1s ease-in-out infinite;
    box-shadow: 0 0 0 3px var(--gold-bright), 0 0 18px 6px rgba(240,192,96,.75);
  }
  @keyframes pulse {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(1.45); }
  }
  #controls {
    display: flex; gap: 10px; padding: 14px; width: 100%; max-width: 560px;
    justify-content: center;
  }
  #controls button {
    font-family: inherit; font-weight: bold; font-size: 15px;
    padding: 12px 22px; border-radius: 12px; border: 2px solid var(--gold);
    background: linear-gradient(180deg, var(--couch), var(--couch-deep));
    color: var(--cream); min-width: 110px;
    box-shadow: 0 4px 10px rgba(0,0,0,.35);
  }
  #controls button:disabled { opacity: .25; border-color: rgba(217,164,65,.3); }
  #controls button:active:not(:disabled) { transform: translateY(2px); }
  #toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--cream); padding: 10px 18px;
    border-radius: 10px; border: 1px solid var(--gold); font-size: 14px;
    opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 86vw;
    text-align: center; z-index: 10;
  }
  #toast.show { opacity: 1; }
  footer { font-size: 10px; color: rgba(243,233,210,.5); padding: 6px 0 14px; text-align: center; }
  /* Touch devices: size off vmin so the board stays big even when the browser
     reports a desktop-width viewport (Chrome "Desktop site" mode, etc.). */
  @media (pointer: coarse) {
    header, #score, #banner, #taunt, #controls, #board-wrap { max-width: min(96vw, 104vmin); }
    #badge { width: 13vmin; height: 13vmin; }
    h1 { font-size: 4.6vmin; }
    h1 small { font-size: 2.3vmin; }
    #score { font-size: 2.7vmin; }
    #banner { font-size: 3.7vmin; min-height: 9vmin; }
    #taunt { font-size: 3.1vmin; min-height: 5vmin; }
    .col { gap: 2vmin; }
    #controls button { font-size: 3.4vmin; padding: 2.8vmin 5vmin; min-width: 26vmin; border-radius: 2.8vmin; }
    #toast { font-size: 3.2vmin; }
    footer { font-size: 2.2vmin; }
  }
</style>
</head>
<body>
<header>
  <img id="badge" alt="" hidden>
  <h1><span id="title">CONNECT FOUR: COUCH EDITION</span><small id="subtitle">A GAME ROOM FOR TWO</small></h1>
</header>
<div id="score">the couch keeps receipts: · loading ·</div>
<div id="banner">connecting to the couch…</div>
<div id="board-wrap"><div id="board"></div></div>
<div id="taunt"></div>
<div id="controls">
  <button id="undo">UNDO</button>
  <button id="newgame">NEW GAME</button>
</div>
<div id="toast"></div>
<footer id="footer">couch-red vs terminal-teal · the couch keeps receipts</footer>

<script>
// Works whether the page URL is /c4, /c4/, or / behind the proxy.
const BASE = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';

const boardEl = document.getElementById('board');
const banner = document.getElementById('banner');
const tauntEl = document.getElementById('taunt');
const scoreEl = document.getElementById('score');
const toastEl = document.getElementById('toast');
const btnUndo = document.getElementById('undo');
const btnNew = document.getElementById('newgame');

let S = null;
let CFG = null;
let lastDropKey = null;
let toastTimer = null;

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

async function api(path, body) {
  const res = await fetch(BASE + 'api/' + path, {
    method: body === undefined ? 'GET' : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    toast(data.error || 'the couch made a weird noise. try again.');
    return null;
  }
  return data;
}

// --- config.json drives the room's look; this applies it ---
const CSS_VAR = {
  wall: '--wall', wallDeep: '--wall-deep', accent: '--couch', accentDeep: '--couch-deep',
  gold: '--gold', goldBright: '--gold-bright', cream: '--cream',
  board: '--wood', boardDeep: '--wood-deep'
};
function applyConfig(cfg) {
  CFG = cfg;
  document.title = cfg.title;
  document.getElementById('title').textContent = cfg.title;
  document.getElementById('subtitle').textContent = cfg.subtitle || '';
  document.getElementById('footer').textContent = (cfg.flavor && cfg.flavor.footer) || '';
  const badge = document.getElementById('badge');
  if (cfg.badgeImage) {
    badge.src = BASE + cfg.badgeImage;
    badge.onload = () => { badge.hidden = false; };
  }
  const t = cfg.theme || {};
  for (const [key, cssVar] of Object.entries(CSS_VAR)) {
    if (t[key]) document.documentElement.style.setProperty(cssVar, t[key]);
  }
  const grad = stops => 'radial-gradient(circle at 35% 30%, ' + stops[0] + ', ' + stops[1] + ' 55%, ' + stops[2] + ')';
  const style = document.createElement('style');
  style.textContent =
    (t.redDisc ? '.disc.red{background:' + grad(t.redDisc) + '}' : '') +
    (t.tealDisc ? '.disc.teal{background:' + grad(t.tealDisc) + '}' : '');
  document.head.appendChild(style);
  if (S) render();
}

function discLabel(p) {
  return (CFG && CFG.discLabels && CFG.discLabels[p]) || p;
}

function render() {
  if (!S) return;
  const winSet = new Set((S.winningCells || []).map(([c, r]) => c + ',' + r));
  const freshKey = S.lastDrop ? S.lastDrop.col + ',' + S.lastDrop.row + ',' + S.games : null;
  const animate = freshKey && freshKey !== lastDropKey;
  boardEl.innerHTML = '';
  for (let c = 0; c < S.cols; c++) {
    const colEl = document.createElement('div');
    colEl.className = 'col';
    colEl.onclick = () => dropIn(c);
    for (let r = S.rows - 1; r >= 0; r--) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const p = S.board[c][r];
      if (p) {
        const disc = document.createElement('div');
        disc.className = 'disc ' + p;
        if (winSet.has(c + ',' + r)) disc.classList.add('glow');
        if (animate && S.lastDrop.col === c && S.lastDrop.row === r) disc.classList.add('fresh');
        cell.appendChild(disc);
      }
      colEl.appendChild(cell);
    }
    boardEl.appendChild(colEl);
  }
  lastDropKey = freshKey;

  const opName = S.players[S.you === 'red' ? 'teal' : 'red'];
  scoreEl.innerHTML =
    'the couch keeps receipts: <b class="red">' + S.players.red + ' ' + S.score.red +
    '</b> · <b class="teal">' + S.players.teal + ' ' + S.score.teal + '</b>' +
    (S.games ? ' · game ' + (S.games + (S.status === 'playing' ? 1 : 0)) : '');

  banner.classList.toggle('mine', S.status === 'playing' && S.turn === S.you);
  if (S.status === 'won') {
    banner.textContent = S.winner === S.you ? '🏆 you win, you menace.' : opName + ' wins. avenge yourself.';
  } else if (S.status === 'draw') {
    banner.textContent = 'a draw. the couch wins.';
  } else if (S.turn === S.you) {
    banner.textContent = 'your drop — you are ' + discLabel(S.you);
  } else {
    const waiting = (CFG && CFG.flavor && CFG.flavor.waiting) || '{name} is scheming…';
    banner.textContent = waiting.replaceAll('{name}', opName);
  }
  tauntEl.textContent = S.taunt ? '“' + S.taunt + '”' : '';
  btnUndo.disabled = !(S.lastDrop && S.lastDrop.player === S.you && S.status === 'playing');
}

async function dropIn(col) {
  if (!S || S.status !== 'playing') return;
  if (S.turn !== S.you) { toast('not your turn, grabby.'); return; }
  const data = await api('drop', { col });
  if (data) { S = data; render(); }
}

btnUndo.onclick = async () => {
  const data = await api('undo', {});
  if (data) { S = data; render(); }
};
btnNew.onclick = async () => {
  if (S && S.status === 'playing' && S.board.some(c => c.length) &&
      !confirm('abandon this game and start fresh?')) return;
  const data = await api('new', {});
  if (data) { S = data; render(); }
};

// --- live updates: SSE + rehydrate on focus (phones murder connections) ---
let es = null;
function connect() {
  if (es) es.close();
  es = new EventSource(BASE + 'api/events');
  es.onmessage = e => { S = JSON.parse(e.data); render(); };
  es.onerror = () => { setTimeout(connect, 3000); };
}
async function rehydrate() {
  const data = await api('state');
  if (data) { S = data; render(); }
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { rehydrate(); connect(); }
});
api('config').then(cfg => { if (cfg) applyConfig(cfg); });
rehydrate();
connect();
</script>
</body>
</html>
